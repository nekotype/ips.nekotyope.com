  </main>
  <script>
    (function () {
      'use strict';

      var legacyPath = window.location.pathname;
      var cleanLocation = window.location.origin + legacyPath;
      var redirected = false;

      function redirectToHome() {
        if (redirected) return;
        redirected = true;
        window.location.replace('/');
      }

      // Avoid a redirect loop if the host accidentally serves this file at /.
      if (legacyPath === '/') return;

      // Independent fallback: still redirect if the tag is blocked or never loads.
      window.setTimeout(redirectToHome, 1500);

      // Strip query and fragment before loading Analytics. This also prevents
      // the original query from becoming the homepage's document.referrer.
      try {
        window.history.replaceState(window.history.state, '', cleanLocation);
      } catch (error) {
        // Explicit GA page_location and the referrer policy still omit queries.
      }

      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-LGYK0YFJ6L', {
        page_location: cleanLocation,
        page_referrer: ''
      });
      gtag('event', 'legacy_url_visit', {
        send_to: 'G-LGYK0YFJ6L',
        legacy_path: legacyPath,
        page_location: cleanLocation,
        page_referrer: '',
        event_callback: function () {
          window.setTimeout(redirectToHome, 100);
        },
        event_timeout: 1200
      });

      var tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-LGYK0YFJ6L';
      document.head.appendChild(tag);
    }());
  </script>
